appId: com.lyrics-app.desktop
productName: 歌词识别
directories:
  output: release

files:
  - dist/**/*
  - dist-electron/**/*

# Binary files placed outside ASAR (executable, needs file system access)
extraResources:
  - from: resources/
    to: .
    filter:
      - "**/*"
      - "!README.md"
  - from: node_modules/ffmpeg-static/ffmpeg
    to: ffmpeg

mac:
  category: public.app-category.music
  target:
    - dmg
    - zip

win:
  target:
    - nsis
    - portable

linux:
  icon: resources/icon.png
  category: Audio
  target:
    - AppImage
    - deb

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
